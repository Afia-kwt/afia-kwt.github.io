<style>
/* Layout: storefront awning (yellow/white stripes + red logo), sticky category rail, photo-first grid, swipeable bottom sheet.
   Single light theme on purpose: it mirrors the lit shop sign. */
:root{
  --bg:#FFFDF7; --surface:#FFFFFF; --ink:#2A1A12; --muted:#80705F; --line:#F0E6D2;
  --red:#ED1C24; --red-deep:#C4141B; --yellow:#F6B800; --yellow-soft:#FFF3CC; --on-red:#FFFFFF;
  --display:"Alexandria","Readex Pro",system-ui,sans-serif;
  --body:"Readex Pro","Segoe UI",Tahoma,system-ui,sans-serif;
  --stripes:repeating-linear-gradient(90deg,var(--yellow) 0 38px,#FFFFFF 38px 76px);
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
header.awning{background:linear-gradient(90deg,#FFFFFF 0 38px,var(--yellow) 38px 76px) calc(50% + 19px) 0/76px 100% repeat-x}
header.awning{position:relative}
header.awning .wrap{padding-block:18px;display:flex;justify-content:center}
.lang{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));inset-inline-end:max(10px,env(safe-area-inset-left,0px));z-index:2;min-width:44px;height:30px;padding:0 10px;border:0;border-radius:999px;background:rgba(255,255,255,.92);color:var(--ink);font:600 .78rem var(--body);cursor:pointer;box-shadow:0 2px 6px rgba(110,60,0,.2)}
.lang:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.plate{width:228px;max-width:100%;display:grid;place-items:center;padding-block:12px 14px;border-radius:14px;background:#FFFFFF;box-shadow:0 3px 0 #E6DFD0,0 10px 18px rgba(110,60,0,.22)}
.plate svg{display:block;width:168px;height:auto;color:var(--red)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);box-shadow:0 1px 0 var(--line)}
.bar .wrap{padding-block:10px;display:flex;gap:8px;align-items:center}
.chips{flex:1;min-width:0;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-block:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:500 .9rem var(--body);padding:7px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.chip[aria-current="true"]{background:var(--red);border-color:var(--red);color:var(--on-red)}
.sbtn{flex:none;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.sbtn[aria-expanded="true"]{background:var(--yellow-soft);border-color:var(--yellow)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--yellow);border-radius:12px;padding:0 12px}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;padding:10px 0;outline:none}
.search svg{flex:none;color:var(--muted)}
.srow .wrap{padding-block:0 10px}
.chip:focus-visible,.card:focus-visible,.close:focus-visible,.sbtn:focus-visible{outline:2px solid var(--red);outline-offset:2px}
main .wrap{padding-block:4px 40px}
section{scroll-margin-top:72px;padding-top:24px}
main{overflow-x:clip}
section h2{position:relative;display:inline-block;font-family:var(--display);font-weight:800;font-size:1.25rem;line-height:1.3;margin:0 0 14px;padding-block:8px;padding-inline:6px 26px;background:var(--yellow);color:var(--red);border-radius:0;border-start-end-radius:999px;border-end-end-radius:999px;text-wrap:balance}
section h2::before{content:"";position:absolute;top:0;bottom:0;inset-inline-start:-100vw;width:100vw;background:var(--yellow)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:920px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{all:unset;box-sizing:border-box;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease;min-width:0}
.card:hover{box-shadow:0 8px 22px rgba(120,70,0,.10)}
.card:active{transform:scale(.98)}
.ph{position:relative;background:#FFFFFF;aspect-ratio:4/3;max-width:100%}
.ph img{width:100%;height:100%;object-fit:contain;display:block}
.num{position:absolute;top:8px;right:8px;min-width:26px;height:26px;padding:0 6px;border-radius:8px;background:var(--yellow);color:var(--ink);font:700 .8rem var(--display);display:grid;place-items:center;font-variant-numeric:tabular-nums}
.ph.noimg{display:grid;place-items:center;background:var(--stripes);text-align:center}
.ph.noimg>div{background:#FFFFFF;border-radius:12px;padding:8px 14px;color:var(--red)}
.ph.noimg strong{display:block;font:800 2rem/1.1 var(--display)}
.ph.noimg span:not(.num){font-size:.75rem;color:var(--ink)}
.sheet .ph.noimg{aspect-ratio:auto;height:150px}
.info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;flex:1}
.info h3{margin:0;font:600 .98rem/1.35 var(--body);text-wrap:balance}
.tag{font-size:.75rem;color:var(--muted)}
.price{margin-top:auto;padding-top:6px;display:flex;align-items:center;justify-content:space-between;gap:6px}
.price b{font:700 .98rem var(--display);color:var(--red);font-variant-numeric:tabular-nums}
.price small{font:400 .72rem var(--body);color:var(--muted)}
[dir="ltr"] .go svg{transform:scaleX(-1)}
.go{width:26px;height:26px;border-radius:50%;background:var(--yellow-soft);color:var(--red-deep);display:grid;place-items:center;flex:none}
.empty{padding:40px 0;text-align:center;color:var(--muted)}
footer{color:var(--muted);font-size:.8rem;text-align:center;padding-block:0 28px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(40,20,5,.5);z-index:20;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{position:fixed;inset:auto 0 0 0;z-index:21;background:var(--surface);border-radius:22px 22px 0 0;max-height:90vh;overflow-y:auto;overscroll-behavior:contain;transform:translateY(100%);transition:transform .25s ease;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.on{transform:none}
.sheet.drag{transition:none}
@media (min-width:720px){.sheet{margin:0 auto;max-width:560px;bottom:24px;border-radius:22px}}
.grab{position:sticky;top:0;z-index:2;height:0}
.grab::before{content:"";position:absolute;top:8px;left:50%;width:44px;height:5px;margin-left:-22px;border-radius:3px;background:rgba(0,0,0,.22)}
.sheet .ph{aspect-ratio:16/10;border-radius:22px 22px 0 0;overflow:hidden;border-bottom:1px solid var(--line)}
.close{position:absolute;top:12px;inset-inline-end:12px;width:36px;height:36px;border-radius:50%;border:0;background:var(--ink);color:#FFFFFF;font-size:20px;cursor:pointer;display:grid;place-items:center;z-index:3}
.sb{padding:16px 18px 24px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.sb h3{margin:0;font:800 1.35rem/1.3 var(--display)}
.sb .meta{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sb .big{font:800 1.2rem var(--display);color:var(--red);font-variant-numeric:tabular-nums;white-space:nowrap}
.grp h4{margin:0 0 8px;font:700 .9rem var(--display);color:var(--ink)}
.rows{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.rows li{display:flex;justify-content:space-between;gap:12px;padding:11px 12px;border-top:1px solid var(--line)}
.rows li:first-child{border-top:0}
.rows li b{font:600 .92rem var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.rows li span{min-width:0}
.pill{display:inline-block;font-size:.7rem;padding:1px 8px;border-radius:999px;background:var(--yellow-soft);color:var(--red-deep);margin-inline-start:6px;vertical-align:middle}
.tbl{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.th,.tr{display:grid;grid-template-columns:minmax(0,1fr) 68px 92px;gap:8px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.th{border-top:0;background:var(--yellow-soft);font:700 .82rem var(--display);position:sticky;top:0}
.th span:not(:first-child),.tr b{text-align:center}
.th small{display:block;font:400 .66rem var(--body);color:var(--muted);line-height:1.2}
.tr span small{display:block;font-size:.72rem;color:var(--muted)}
.tr b{font:600 .92rem var(--display);font-variant-numeric:tabular-nums}
.tr b.sup{color:var(--red)}
.tr b.na{color:var(--muted);font-weight:400}
.note{margin:0;color:var(--muted);font-size:.88rem}
.free{display:flex;flex-wrap:wrap;gap:6px}
.free span{background:var(--yellow-soft);border-radius:999px;padding:5px 12px;font-size:.85rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function priceHTML(it){const[a,b]=minMax(it);return `${a!==b?`<small>${t("من ")}</small>`:""}<b>${kd(a)}</b> <small>${KD()}</small>`}
function samRows(it){const reg=it.opts.filter(o=>o.s==="صمون عادي"),sup=it.opts.filter(o=>o.s!=="صمون عادي"),rows=[];
  reg.forEach(o=>{if(o.n==="بطاط مايونيز")return;
    if(o.n==="بطاط كاتشب"){const s=sup.find(x=>x.n==="بطاط سوبر");rows.push({n:"بطاط كاتشب مايونيز",p:o.p,s:s&&s.p,sub:"السوبر: + خس وجبن سلايس"});return}
    const s=sup.find(x=>x.n===o.n+" سوبر");rows.push({n:o.n,p:o.p,s:s?s.p:null})});return rows}
function ph(it,lazy){return it.noimg?`<div class="ph noimg"><div><strong>${samRows(it).length}</strong><span>${t("حشوة، عادي وسوبر")}</span></div>`:`<div class="ph"><img ${lazy?'loading="lazy"':""} src="img/${it.id}.webp" alt="${t(it.name)}">`}
function card(it){return `<button class="card" data-id="${it.id}">${ph(it,1)}</div><div class="info"><h3>${t(it.name)}</h3>${it.samoun?`<span class="tag">${t("اضغط لاختيار الحشوة")}</span>`:it.opts?`<span class="tag">${it.opts.length} ${t("خيارات")}</span>`:""}<span class="price"><span>${priceHTML(it)}</span><span class="go" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="m15 6-6 6 6 6"/></svg></span></span></div></button>`}
function render(q=""){
  q=q.trim().toLowerCase();const has=s=>s.includes(q)||t(s).toLowerCase().includes(q);const m=$("#menu");let html="";
  DATA.cats.forEach((c,i)=>{const its=DATA.items.filter(it=>it.cat===c&&(!q||has(it.name)||has(c)||(it.opts||[]).some(o=>has(o.n.replace(/(، | )سوبر$/,"")))));
    if(!its.length)return;html+=`<section id="c${i}"><h2>${t(c)}</h2><div class="grid">${its.map(card).join("")}</div></section>`});
  m.innerHTML=html||`<p class="empty">${t("ما لقينا شي بهالاسم. جرّب كلمة ثانية.")}</p>`;
}
function chips(){$("#chips").innerHTML=DATA.cats.map((c,i)=>`<button class="chip" data-i="${i}">${t(c)}</button>`).join("");}
$("#chips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;const s=document.getElementById("c"+b.dataset.i);if(s)s.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})});
function spy(){let cur=0;DATA.cats.forEach((c,i)=>{const s=document.getElementById("c"+i);if(s&&s.getBoundingClientRect().top<160)cur=i});
  document.querySelectorAll(".chip").forEach(b=>{const on=+b.dataset.i===cur;if(on!==(b.getAttribute("aria-current")==="true")){b.setAttribute("aria-current",on);if(on)b.scrollIntoView({block:"nearest",inline:"center"})}})}
addEventListener("scroll",spy,{passive:true});
$("#q").addEventListener("input",e=>{render(e.target.value);spy()});
$("#menu").addEventListener("click",e=>{const c=e.target.closest(".card");if(c)open(+c.dataset.id)});
let last=null;
function open(id){const it=DATA.items.find(x=>x.id===id);last=document.activeElement;const[a,b]=minMax(it);
  let h=`<div class="grab"></div>${ph(it,0)}<button class="close" id="cl" aria-label="${t("إغلاق")}">×</button></div><div class="sb">
  <div class="meta"><h3 id="st">${t(it.name)}</h3><span class="big">${a!==b?`<small style="font-size:.7em">${t("من ")}</small>`:''}${kd(a)} ${KD()}</span></div>`;
  if(it.note)h+=`<p class="note">${t(it.note)}</p>`;
    if(it.samoun){const reg=it.opts.filter(o=>o.s==="صمون عادي"),sup=it.opts.filter(o=>o.s!=="صمون عادي");
    h+=`<div class="grp"><h4>${t("اختر الحشوة")}</h4><div class="tbl"><div class="th"><span>${t("الحشوة")}</span><span>${t("عادي")}<small>${t("صمون")}</small></span><span>${t("سوبر")}<small>${t("لبناني كبير أو صاج")}</small></span></div>
    ${samRows(it).map(r=>`<div class="tr"><span>${t(r.n)}${r.sub?`<small>${t(r.sub)}</small>`:""}</span><b>${kd(r.p)}</b>${r.s!=null?`<b class="sup">${kd(r.s)}</b>`:`<b class="na">—</b>`}</div>`).join("")}
    </div><p class="note" style="margin-top:6px">${t("الأسعار بالدينار الكويتي. السوبر متوفر للحشوات اللي جنبها سعر.")}</p></div>
    <div class="grp"><h4>${t("تعديلات مجانية حسب الحشوة")}</h4><div class="free">${["من غير طماط","سادة","مع مخلل","مع طماط"].map(s=>`<span>${t(s)}</span>`).join("")}</div></div>`}
  else if(it.opts){h+=`<div class="grp"><h4>${t(it.shaw?"اختر الخبز والحجم":"الأنواع")}</h4><ul class="rows">${it.opts.map(o=>`<li><span>${t(o.n.replace("، سوبر",""))}${o.s==="سوبر"?`<span class="pill">${t("سوبر")}</span>`:''}</span><b>${kd(o.p)} ${KD()}</b></li>`).join("")}</ul></div>`}
  if(it.shaw){
    h+=`<div class="grp"><h4>${t("تعديلات مجانية")}</h4><div class="free">${SHAW_FREE.map(s=>`<span>${t(s)}</span>`).join("")}</div></div>
    <p class="note">${t("الشاورما بدون مايونيز أو خس أو كاتشب. السوبر خبز أكبر وحشوة أكثر.")}</p>`}
  h+=`</div>`;
  const sh=$("#sheet"),sc=$("#scrim");sh.innerHTML=h;sh.hidden=sc.hidden=false;sh.scrollTop=0;
  requestAnimationFrame(()=>{sh.classList.add("on");sc.classList.add("on")});$("#cl").onclick=close;$("#cl").focus();document.body.style.overflow="hidden"}
function close(){const sh=$("#sheet"),sc=$("#scrim");sh.classList.remove("on");sc.classList.remove("on");document.body.style.overflow="";setTimeout(()=>{sh.hidden=sc.hidden=true},250);if(last)last.focus()}
$("#scrim").addEventListener("click",close);
addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#sheet").hidden)close()});
$("#sb").addEventListener("click",()=>{const r=$("#srow"),on=r.hidden;r.hidden=!on;$("#sb").setAttribute("aria-expanded",on);if(on)$("#q").focus();else if($("#q").value){$("#q").value="";render();spy()}});
(()=>{const sh=$("#sheet");let y0=null,dy=0;
  sh.addEventListener("touchstart",e=>{if(sh.scrollTop<=0){y0=e.touches[0].clientY;dy=0}else y0=null},{passive:true});
  sh.addEventListener("touchmove",e=>{if(y0==null)return;dy=e.touches[0].clientY-y0;if(dy>0){sh.classList.add("drag");sh.style.transform=`translateY(${dy}px)`}},{passive:true});
  sh.addEventListener("touchend",()=>{if(y0==null)return;sh.classList.remove("drag");sh.style.transform="";if(dy>90)close();y0=null});
})();
$("#lang").addEventListener("click",()=>{L=L==="en"?"ar":"en";try{localStorage.setItem("afia-lang",L)}catch(e){}
  const y=scrollY;applyLang();chips();render($("#q").value);scrollTo(0,y);spy()});
applyLang();chips();render();spy();
</script>

</body>
</html>
